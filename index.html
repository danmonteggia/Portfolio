    :root {
      --color-fondo: #0d0d0d;
      --color-vidrio: rgba(15, 15, 15, 0.6);
      --color-vidrio-borde: rgba(255, 255, 255, 0.08);
      --color-amarillo: #ffe14d;
      --color-amarillo-suave: rgba(255, 225, 77, 0.18);
      --color-texto: #f5f5f5;
      --color-texto-tenue: rgba(245, 245, 245, 0.55);
      --curva-resorte: cubic-bezier(0.34, 1.56, 0.64, 1);
      --curva-suave: cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--color-fondo);
      color: var(--color-texto);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;

      width: 100%; padding: 12px 16px; border-radius: 14px;

      background: rgba(255,255,255,0.04);
      color: var(--color-texto); font-size: 0.95rem; outline: none;
      transition: border-color 0.3s var(--curva-suave);
    }
    .entregas__input:focus { border-color: var(--color-amarillo); }
    .entregas__lista { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
    .entregas__item-evento {
      padding: 12px 14px; border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--color-vidrio-borde);
      cursor: pointer; font-size: 0.9rem;
      transition: background 0.25s var(--curva-suave), border-color 0.25s var(--curva-suave);
    }
    .entregas__item-evento:hover { background: var(--color-amarillo-suave); border-color: var(--color-amarillo); }
    .entregas__boton {
      width: 100%; margin-top: 14px; padding: 12px 16px;
      border-radius: 14px; border: none;
      background: var(--color-amarillo); color: #1a1a05;
      font-weight: 600; font-size: 0.95rem; cursor: pointer;
      transition: transform 0.2s var(--curva-suave), opacity 0.2s var(--curva-suave);
    }
    .entregas__boton:hover { opacity: 0.9; }
    .entregas__boton:active { transform: scale(0.98); }
    .entregas__boton:disabled { opacity: 0.6; cursor: not-allowed; }
    .entregas__error { margin-top: 10px; font-size: 0.82rem; color: #ff6b6b; }
    .entregas__error.oculto { display: none; }
    .entregas__volver {
      display: inline-block; margin-top: 14px;
      background: none; border: none;
      color: var(--color-texto-tenue); font-size: 0.85rem; cursor: pointer;
      transition: color 0.3s var(--curva-suave);
    }
    .entregas__volver:hover { color: var(--color-amarillo); }
    .entregas__cargando { text-align: center; padding: 30px; color: var(--color-texto-tenue); font-size: 0.9rem; }
    .entregas__cargando.oculto { display: none; }
    .entregas__encabezado-galeria {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; padding: 0 4px;
    }
    #pasoGaleriaEntrega .galeria { margin: 0 auto; padding: 0; }

    @media (max-width: 720px) {
      .entregas__panel { padding: 20px; }
      .entregas__panel.expandido { padding: 0; }
      .lightbox__peek { width: 80px; }
      .lightbox__peek img { width: 70px; }
      .lightbox__flecha--izq { left: 8px; }
      .lightbox__flecha--der { right: 8px; }
    }

    .pie { text-align: center; padding: 24px 16px 48px; color: var(--color-texto-tenue); font-size: 0.75rem; letter-spacing: 0.05em; }

    button, a, [role="button"], .item-foto, .album-card {
      cursor: url("data:image/svg+xml,%3Csvg%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%22-9%20-9%2082%2082%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%20%3Cg%20transform%3D%22rotate%2818%2032%2032%29%22%3E%20%3Crect%20x%3D%2210%22%20y%3D%2220%22%20width%3D%2244%22%20height%3D%2228%22%20rx%3D%226%22%20fill%3D%22%23252521%22%20stroke%3D%22%23000000%22%20stroke-width%3D%221.5%22/%3E%20%3Crect%20x%3D%2210%22%20y%3D%2220%22%20width%3D%2244%22%20height%3D%229%22%20rx%3D%226%22%20fill%3D%22%23B4B2A9%22%20stroke%3D%22%23000000%22%20stroke-width%3D%221.5%22/%3E%20%3Crect%20x%3D%2225%22%20y%3D%2212%22%20width%3D%2214%22%20height%3D%229%22%20rx%3D%222%22%20fill%3D%22%23B4B2A9%22%20stroke%3D%22%23000000%22%20stroke-width%3D%221.5%22/%3E%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2236%22%20r%3D%2211%22%20fill%3D%22%23444441%22%20stroke%3D%22%23000000%22%20stroke-width%3D%221.5%22/%3E%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2236%22%20r%3D%227%22%20fill%3D%22%23888780%22%20stroke%3D%22%23000000%22%20stroke-width%3D%221%22/%3E%20%3Ccircle%20cx%3D%2229.5%22%20cy%3D%2233.5%22%20r%3D%222%22%20fill%3D%22%23D3D1C7%22/%3E%20%3Ccircle%20cx%3D%2248%22%20cy%3D%2223.5%22%20r%3D%222.6%22%20fill%3D%22%23FAC775%22%20stroke%3D%22%23000000%22%20stroke-width%3D%221%22/%3E%20%3C/g%3E%20%3C/svg%3E") 9 9, pointer !important;
    }
  </style>
</head>
<body>

</button><a class="filtro filtro--instagram" href="https://www.instagram.com/pics.i.am/" target="_blank" rel="noopener noreferrer" aria-label="Visitar Instagram">

  <footer class="pie">© Portafolio de fotografía — Todos los derechos reservados</footer>

  <script>
    /* ============================================================
       ⚠️  ÚNICA LÍNEA QUE HAY QUE EDITAR
       Pegá aquí la URL de tu Apps Script (termina en /exec)
       ============================================================ */
    var API_URL = 'https://script.google.com/macros/s/AKfycbxc4YeRZNE-JetDOCrOZon_doHO7Wgml177O8KUl614fzpFuRR7aHjZpX9WJbWYiTcH/exec';

    /* ============================================================
       HELPERS DE API — reemplazan google.script.run
       ============================================================ */
    function apiGet(params) {
      var query = Object.keys(params)
        .map(function(k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); })
        .join('&');
      return fetch(API_URL + '?' + query).then(function(r) { return r.json(); });
    }

    function apiPost(body) {
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(function(r) { return r.json(); });
    }

    /* ============================================================
       ESTADO GLOBAL
       ============================================================ */
    var catalogo = [];
    var vistaActiva = 'retratos';
    var elementoOrigen = null;
    var fotoActualLightbox = null;
    var indiceActualLightbox = -1;
    var catalogoFiltrado = [];
    var likesMemoria = {};

    var albumesData = {};
    var albumActivoTitulo = null;

    var listaEventosCache = [];
    var eventoSeleccionado = null;
    var entregaActiva = false;
    var catalogoEntregaActiva = [];

    var zoomEscala = 1;
    var zoomOffsetX = 0;
    var zoomOffsetY = 0;
    var zoomArrastrando = false;
    var zoomArrastreInicioX = 0;
    var zoomArrastreInicioY = 0;
    var zoomOffsetXInicio = 0;
    var zoomOffsetYInicio = 0;
    var ZOOM_NIVEL = 2.5;

    var likesYaDados = {};
    try {
      var guardado = localStorage.getItem('picsiam_likes');
      likesYaDados = guardado ? JSON.parse(guardado) : {};
    } catch(e) { likesYaDados = {}; }

    function guardarLikesLocales() {
      try { localStorage.setItem('picsiam_likes', JSON.stringify(likesYaDados)); } catch(e) {}
    }

    /* ============================================================
       CARGA INICIAL
       ============================================================ */
    function iniciar() {
      apiGet({ action: 'catalogo' })
        .then(function(datos) {
          catalogo = datos;
          construirAlbumes();
          return apiGet({ action: 'likes' });
        })
        .then(function(likes) {
          likesMemoria = likes || {};
          aplicarFiltroGaleria('retratos');
        })
        .catch(function(error) {
          console.error('Error al cargar el catálogo:', error);
        });
    }

    /* ============================================================
       ÁLBUMES
       ============================================================ */
    function construirAlbumes() {
      albumesData = {};
      catalogo.forEach(function(foto) {
        if (!albumesData[foto.titulo]) albumesData[foto.titulo] = [];
        albumesData[foto.titulo].push(foto);
      });
    }

    /* ============================================================
       NAVEGACIÓN PRINCIPAL
       ============================================================ */
    document.getElementById('filtros').addEventListener('click', function(evento) {
      var boton = evento.target.closest('.filtro');
      if (!boton) return;
      if (boton.classList.contains('filtro--instagram')) return;
      var vista = boton.dataset.vista;
      if (!vista) return;
      activarVista(vista);
    });

    function activarVista(vista) {
      vistaActiva = vista;
      document.querySelectorAll('.filtro[data-vista]').forEach(function(b) {
        b.classList.toggle('activo', b.dataset.vista === vista);
      });
      document.getElementById('galeria').style.display = 'none';
      document.getElementById('seccionAlbumes').classList.remove('visible');
      document.getElementById('seccionEntregas').classList.remove('visible');

      if (vista === 'todo') {
        document.getElementById('galeria').style.display = '';
        aplicarFiltroGaleria('todo');
      } else if (vista === 'retratos') {
        document.getElementById('galeria').style.display = '';
        aplicarFiltroGaleria('retratos');
      } else if (vista === 'albumes') {
        document.getElementById('seccionAlbumes').classList.add('visible');
        mostrarGridAlbumes();
      } else if (vista === 'entregas') {
        abrirSeccionEntregas();
      }
    }

    /* ============================================================
       GALERÍA
       ============================================================ */
    function aplicarFiltroGaleria(categoria) {
      var fotos = categoria === 'retratos'
        ? catalogo.filter(function(f) { return f.categoria === 'retratos'; })
        : catalogo.slice();

      renderizarGaleriaLadrillo(document.getElementById('galeria'), fotos, function(foto, item) {
        entregaActiva = false;
        catalogoFiltrado = fotos;
        indiceActualLightbox = fotos.findIndex(function(f) { return f.id_drive === foto.id_drive; });
        abrirLightbox(foto, item);
      });
    }

    function obtenerCantidadColumnas() {
      var ancho = window.innerWidth;
      if (ancho <= 420) return 2;
      if (ancho <= 720) return 2;
      if (ancho <= 1024) return 3;
      if (ancho <= 1280) return 4;
      return 5;
    }

    function renderizarGaleriaLadrillo(contenedor, fotos, alClickearFoto) {
      contenedor.innerHTML = '';
      var numColumnas = obtenerCantidadColumnas();
      var columnas = [];
      for (var c = 0; c < numColumnas; c++) {
        var columna = document.createElement('div');
        columna.className = 'galeria__columna';
        if (c % 2 === 1) columna.classList.add('galeria__columna--offset');
        contenedor.appendChild(columna);
        columnas.push(columna);
      }
      fotos.forEach(function(foto, idx) {
        var item = crearItemFoto(foto);
        item.addEventListener('click', function() { alClickearFoto(foto, item); });
        columnas[idx % numColumnas].appendChild(item);
      });
    }

    var lazyObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var img = entry.target;
          img.src = img.dataset.src;
          lazyObserver.unobserve(img);
        }
      });
    }, { rootMargin: '200px' });

    function crearItemFoto(foto) {
      var item = document.createElement('div');
      item.className = 'item-foto';
      item.dataset.id = foto.id;
      item.dataset.categoria = foto.categoria;
      var img = document.createElement('img');
      img.dataset.src = foto.url + '=w600';
      img.alt = foto.titulo || '';
      item.appendChild(img);
      lazyObserver.observe(img);
      return item;
    }

    /* ============================================================
       ÁLBUMES: grid de cards
       ============================================================ */
    function mostrarGridAlbumes() {
      document.getElementById('albumInterno').classList.remove('visible');
      document.getElementById('albumesGrid').style.display = '';
      var grid = document.getElementById('albumesGrid');
      grid.innerHTML = '';
      Object.keys(albumesData).forEach(function(titulo) {
        var fotos = albumesData[titulo];
        if (!fotos.length) return;
        var card = document.createElement('div');
        card.className = 'album-card';
        var thumbWrap = document.createElement('div');
        thumbWrap.className = 'album-card__thumb-wrap';
        var thumb = document.createElement('img');
        thumb.className = 'album-card__thumb';
        thumb.src = fotos[0].url;
        thumb.alt = titulo;
        thumb.loading = 'lazy';
        var info = document.createElement('div');
        info.className = 'album-card__info';
        info.innerHTML =
          '<div class="album-card__nombre">' + titulo + '</div>' +
          '<div class="album-card__cantidad">' + fotos.length + ' foto' + (fotos.length !== 1 ? 's' : '') + '</div>';
        thumbWrap.appendChild(thumb);
        card.appendChild(thumbWrap);
        card.appendChild(info);
        card.addEventListener('click', function() { abrirAlbum(titulo, fotos); });
        grid.appendChild(card);
      });
    }

    function abrirAlbum(titulo, fotos) {
      albumActivoTitulo = titulo;
      document.getElementById('albumesGrid').style.display = 'none';
      document.getElementById('albumInternoTitulo').textContent = titulo;
      renderizarGaleriaLadrillo(document.getElementById('galeriaAlbum'), fotos, function(foto, item) {
        entregaActiva = false;
        catalogoFiltrado = fotos.slice();
        indiceActualLightbox = fotos.findIndex(function(f) { return f.id_drive === foto.id_drive; });
        abrirLightbox(foto, item);
      });
      document.getElementById('albumInterno').classList.add('visible');
    }

    document.getElementById('btnVolverAlbumes').addEventListener('click', function() {
      document.getElementById('albumInterno').classList.remove('visible');
      document.getElementById('albumesGrid').style.display = '';
      albumActivoTitulo = null;
    });

    /* ============================================================
       LIGHTBOX
       ============================================================ */
    function abrirLightbox(foto, item) {
      elementoOrigen = item;
      fotoActualLightbox = foto;
      if (item) item.classList.add('origen-activo');

      var lightbox = document.getElementById('lightbox');
      var wrapper = document.getElementById('lightboxImagenWrapper');
      var imagen = document.getElementById('lightboxImagen');
      var titulo = document.getElementById('lightboxTitulo');
      var categoria = document.getElementById('lightboxCategoria');
      var corazon = document.getElementById('iconoCorazon');
      var botonDescarga = document.getElementById('botonDescarga');

      resetearZoom();
      corazon.classList.remove('activo', 'rebote');

      if (foto.titulo && foto.titulo.trim() !== '') {
        titulo.textContent = foto.titulo;
        titulo.style.display = '';
      } else {
        titulo.textContent = '';
        titulo.style.display = 'none';
      }
      categoria.textContent = foto.categoria;

      if (entregaActiva && foto.url_descarga) {
        botonDescarga.href = foto.url_descarga;
        botonDescarga.download = foto.titulo || 'foto';
        botonDescarga.classList.remove('oculto');
      } else {
        botonDescarga.classList.add('oculto');
        botonDescarga.removeAttribute('href');
      }

      actualizarContadorLikes(foto.id_drive);

      wrapper.classList.remove('cargada');
      wrapper.classList.add('cargando');
      imagen.removeAttribute('src');
      imagen.onload = function() {
        setTimeout(function() {
          wrapper.classList.remove('cargando');
          wrapper.classList.add('cargada');
        }, 150);
      };
      requestAnimationFrame(function() {
        imagen.src = entregaActiva ? foto.url + '=w2000' : foto.url;
      });

      actualizarNavegacion();
      lightbox.classList.add('visible');
    }

    function actualizarNavegacion() {
      var lista = entregaActiva ? catalogoEntregaActiva : catalogoFiltrado;
      var idx = entregaActiva
        ? catalogoEntregaActiva.findIndex(function(f) { return f.id_drive === fotoActualLightbox.id_drive; })
        : indiceActualLightbox;

      var flechaIzq = document.getElementById('flechaIzq');
      var flechaDer = document.getElementById('flechaDer');
      var peekIzq = document.getElementById('peekIzq');
      var peekDer = document.getElementById('peekDer');

      var hayAnterior = idx > 0;
      var haySiguiente = idx < lista.length - 1;

      flechaIzq.classList.toggle('oculto', !hayAnterior);
      flechaDer.classList.toggle('oculto', !haySiguiente);

      peekIzq.src = hayAnterior ? lista[idx - 1].url : '';
      peekDer.src = haySiguiente ? lista[idx + 1].url : '';
    }

    function irFoto(direccion) {
      var lista = entregaActiva ? catalogoEntregaActiva : catalogoFiltrado;
      var idx = entregaActiva
        ? catalogoEntregaActiva.findIndex(function(f) { return f.id_drive === fotoActualLightbox.id_drive; })
        : indiceActualLightbox;

      var nuevoIdx = idx + direccion;
      if (nuevoIdx < 0 || nuevoIdx >= lista.length) return;
      if (!entregaActiva) indiceActualLightbox = nuevoIdx;
      if (elementoOrigen) {
        elementoOrigen.classList.remove('origen-activo');
        elementoOrigen = null;
      }
      abrirLightbox(lista[nuevoIdx], null);
    }

    document.getElementById('flechaIzq').addEventListener('click', function() { irFoto(-1); });
    document.getElementById('flechaDer').addEventListener('click', function() { irFoto(1); });

    document.addEventListener('keydown', function(evento) {
      if (!document.getElementById('lightbox').classList.contains('visible')) return;
      if (evento.key === 'Escape') { cerrarLightbox(); return; }
      if (evento.key === 'ArrowLeft') { irFoto(-1); return; }
      if (evento.key === 'ArrowRight') { irFoto(1); return; }
    });

    function cerrarLightbox() {
      document.getElementById('lightbox').classList.remove('visible');
      if (elementoOrigen) {
        elementoOrigen.classList.remove('origen-activo');
        elementoOrigen = null;
      }
      resetearZoom();
    }

    document.getElementById('btnCerrarLightbox').addEventListener('click', cerrarLightbox);
    document.getElementById('lightbox').addEventListener('click', function(evento) {
      if (evento.target === this) cerrarLightbox();
    });

    /* ============================================================
       ZOOM
       ============================================================ */
    function aplicarTransformImagen() {
      var imagen = document.getElementById('lightboxImagen');
      imagen.style.transform =
        'translate(' + zoomOffsetX + 'px, ' + zoomOffsetY + 'px) scale(' + zoomEscala + ')';
    }

    function resetearZoom() {
      zoomEscala = 1; zoomOffsetX = 0; zoomOffsetY = 0; zoomArrastrando = false;
      var imagen = document.getElementById('lightboxImagen');
      var wrapper = document.getElementById('lightboxImagenWrapper');
      var btnZoom = document.getElementById('btnZoom');
      imagen.style.transition = 'filter 0.6s var(--curva-suave), opacity 0.6s var(--curva-suave), transform 0.35s ease';
      imagen.style.transform = 'translate(0,0) scale(1)';
      wrapper.classList.remove('zoomed', 'arrastrando');
      btnZoom.classList.remove('activo');
      btnZoom.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/><path d="M11 8v6M8 11h6"/></svg>';
      setTimeout(function() { imagen.style.transition = 'filter 0.6s, opacity 0.6s'; }, 400);
    }

    function activarZoom(clientX, clientY) {
      var wrapper = document.getElementById('lightboxImagenWrapper');
      var imagen = document.getElementById('lightboxImagen');
      var btnZoom = document.getElementById('btnZoom');
      var rect = wrapper.getBoundingClientRect();
      var rx = (clientX - rect.left) / rect.width;
      var ry = (clientY - rect.top) / rect.height;
      var iw = imagen.offsetWidth;
      var ih = imagen.offsetHeight;
      zoomEscala = ZOOM_NIVEL;
      zoomOffsetX = (0.5 - rx) * iw * (zoomEscala - 1);
      zoomOffsetY = (0.5 - ry) * ih * (zoomEscala - 1);
      imagen.style.transition = 'filter 0.6s, opacity 0.6s, transform 0.3s ease';
      aplicarTransformImagen();
      setTimeout(function() { imagen.style.transition = 'filter 0.6s, opacity 0.6s'; }, 350);
      wrapper.classList.add('zoomed');
      btnZoom.classList.add('activo');
      btnZoom.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/><path d="M8 11h6"/></svg>';
    }

    function clampZoomOffset() {
      var wrapper = document.getElementById('lightboxImagenWrapper');
      var rect = wrapper.getBoundingClientRect();
      var iw = rect.width * zoomEscala;
      var ih = rect.height * zoomEscala;
      var maxX = Math.max(0, (iw - rect.width) / 2);
      var maxY = Math.max(0, (ih - rect.height) / 2);
      zoomOffsetX = Math.max(-maxX, Math.min(maxX, zoomOffsetX));
      zoomOffsetY = Math.max(-maxY, Math.min(maxY, zoomOffsetY));
    }

    document.getElementById('lightboxImagenWrapper').addEventListener('click', function(e) {
      if (_arrastreFueClick) { _arrastreFueClick = false; return; }
      if (zoomEscala > 1) { resetearZoom(); }
    });

    document.getElementById('btnZoom').addEventListener('click', function(e) {
      e.stopPropagation();
      if (zoomEscala > 1) {
        resetearZoom();
      } else {
        var wrapper = document.getElementById('lightboxImagenWrapper');
        var rect = wrapper.getBoundingClientRect();
        activarZoom(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }
    });

    document.getElementById('lightboxImagenWrapper').addEventListener('wheel', function(e) {
      e.preventDefault();
      var wrapper = document.getElementById('lightboxImagenWrapper');
      var imagen = document.getElementById('lightboxImagen');
      var rect = wrapper.getBoundingClientRect();
      var delta = e.deltaY < 0 ? 0.3 : -0.3;
      var nuevaEscala = Math.max(1, Math.min(5, zoomEscala + delta));
      if (nuevaEscala === 1) { resetearZoom(); return; }
      var rx = (e.clientX - rect.left) / rect.width;
      var ry = (e.clientY - rect.top) / rect.height;
      var iw = imagen.offsetWidth;
      var ih = imagen.offsetHeight;
      var escalaAnterior = zoomEscala;
      zoomOffsetX = zoomOffsetX - (rx - 0.5) * iw * (nuevaEscala - escalaAnterior);
      zoomOffsetY = zoomOffsetY - (ry - 0.5) * ih * (nuevaEscala - escalaAnterior);
      zoomEscala = nuevaEscala;
      clampZoomOffset();
      aplicarTransformImagen();
      var btnZoom = document.getElementById('btnZoom');
      wrapper.classList.add('zoomed');
      btnZoom.classList.add('activo');
      btnZoom.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/><path d="M8 11h6"/></svg>';
    }, { passive: false });

    var _arrastreFueClick = false;
    document.getElementById('lightboxImagenWrapper').addEventListener('mousedown', function(e) {
      if (zoomEscala <= 1) return;
      e.preventDefault();
      _arrastreFueClick = false;
      zoomArrastrando = true;
      zoomArrastreInicioX = e.clientX; zoomArrastreInicioY = e.clientY;
      zoomOffsetXInicio = zoomOffsetX; zoomOffsetYInicio = zoomOffsetY;
    });
    document.addEventListener('mousemove', function(e) {
      if (!zoomArrastrando) return;
      var dx = e.clientX - zoomArrastreInicioX;
      var dy = e.clientY - zoomArrastreInicioY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) _arrastreFueClick = true;
      zoomOffsetX = zoomOffsetXInicio + dx;
      zoomOffsetY = zoomOffsetYInicio + dy;
      clampZoomOffset();
      aplicarTransformImagen();
    });
    document.addEventListener('mouseup', function() { if (!zoomArrastrando) return; zoomArrastrando = false; });

    var touchInicioX = 0, touchInicioY = 0;
    var touchOffsetXInicio = 0, touchOffsetYInicio = 0;
    var touchMovioMucho = false;

    document.getElementById('lightboxImagenWrapper').addEventListener('touchstart', function(e) {
      if (e.touches.length !== 1) return;
      touchInicioX = e.touches[0].clientX; touchInicioY = e.touches[0].clientY;
      touchOffsetXInicio = zoomOffsetX; touchOffsetYInicio = zoomOffsetY;
      touchMovioMucho = false;
    }, { passive: true });

    document.getElementById('lightboxImagenWrapper').addEventListener('touchmove', function(e) {
      if (zoomEscala <= 1 || e.touches.length !== 1) return;
      e.preventDefault();
      var dx = e.touches[0].clientX - touchInicioX;
      var dy = e.touches[0].clientY - touchInicioY;
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) touchMovioMucho = true;
      zoomOffsetX = touchOffsetXInicio + dx;
      zoomOffsetY = touchOffsetYInicio + dy;
      clampZoomOffset();
      aplicarTransformImagen();
    }, { passive: false });

    /* ============================================================
       LIKE VOLADOR
       ============================================================ */
    function activarLike(x, y) {
      var corazonDestino = document.getElementById('iconoCorazon');
      var rectDestino = corazonDestino.getBoundingClientRect();
      var like = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      like.setAttribute('viewBox', '0 0 24 24');
      like.classList.add('like-volador', 'fase-salto');
      like.innerHTML = '<path d="M12 20.3C12 20.3 3 15.4 3 9.6C3 6.6 5.2 4.6 7.8 4.6C9.7 4.6 11.1 5.7 12 7.1C12.9 5.7 14.3 4.6 16.2 4.6C18.8 4.6 21 6.6 21 9.6C21 15.4 12 20.3 12 20.3Z"/>';
      like.style.left = x + 'px';
      like.style.top = y + 'px';
      document.body.appendChild(like);
      corazonDestino.classList.add('activo');
      setTimeout(function() {
        var destinoX = rectDestino.left + rectDestino.width / 2;
        var destinoY = rectDestino.top + rectDestino.height / 2;
        like.classList.remove('fase-salto');
        like.classList.add('fase-vuelo');
        like.style.left = destinoX + 'px';
        like.style.top = destinoY + 'px';
        like.style.transform = 'translate(-50%,-50%) scale(0.3)';
        like.style.opacity = '0';
        setTimeout(function() {
          corazonDestino.classList.add('rebote');
          like.remove();
          setTimeout(function() { corazonDestino.classList.remove('rebote'); }, 500);
        }, 1400);
      }, 380);
    }

    /* ============================================================
       LIKES
       ============================================================ */
    function actualizarContadorLikes(idDrive) {
      var cantidad = likesMemoria[idDrive] || 0;
      var el = document.getElementById('contadorLikes');
      el.textContent = cantidad > 0 ? cantidad : '';
      el.classList.toggle('activo', cantidad > 0);
      var corazon = document.getElementById('iconoCorazon');
      if (likesYaDados[idDrive]) { corazon.classList.add('activo'); }
    }

    function registrarLike(foto) {
  var id = foto.id_drive;
  if (likesYaDados[id]) return;
  likesYaDados[id] = true;
  guardarLikesLocales();
  likesMemoria[id] = (likesMemoria[id] || 0) + 1;
  actualizarContadorLikes(id);
  // ← cambiado de apiPost a apiGet
  apiGet({ action: 'like', id_drive: id })
    .catch(function(err) { console.error('Error al guardar like:', err); });
}

    document.getElementById('lightboxImagenWrapper').addEventListener('dblclick', function(evento) {
      activarLike(evento.clientX, evento.clientY);
      registrarLike(fotoActualLightbox);
    });

    var ultimoTap = 0;
    document.getElementById('lightboxImagenWrapper').addEventListener('touchend', function(evento) {
      var ahora = Date.now();
      if (ahora - ultimoTap < 300 && !touchMovioMucho) {
        var toque = evento.changedTouches[0];
        activarLike(toque.clientX, toque.clientY);
        registrarLike(fotoActualLightbox);
      }
      ultimoTap = ahora;
    });

    /* ============================================================
       ENTREGAS
       ============================================================ */
    function abrirSeccionEntregas() {
      document.getElementById('galeria').style.display = 'none';
      document.getElementById('seccionAlbumes').classList.remove('visible');
      document.getElementById('seccionEntregas').classList.add('visible');
      document.getElementById('panelEntregas').classList.remove('expandido');
      mostrarPasoEntregas('pasoBuscarEvento');

      if (listaEventosCache.length === 0) {
        // ← reemplaza google.script.run.obtenerListaEventos()
        apiGet({ action: 'eventos' })
          .then(function(eventos) {
            listaEventosCache = eventos;
            renderizarListaEventos(eventos);
          })
          .catch(function(error) { console.error('Error al obtener eventos:', error); });
      } else {
        renderizarListaEventos(listaEventosCache);
      }
    }

    function mostrarPasoEntregas(idPaso) {
      ['pasoBuscarEvento', 'pasoCodigo', 'pasoGaleriaEntrega'].forEach(function(id) {
        document.getElementById(id).classList.toggle('oculto', id !== idPaso);
      });
      document.getElementById('panelEntregas').classList.toggle('expandido', idPaso === 'pasoGaleriaEntrega');
    }

    function renderizarListaEventos(eventos) {
      var contenedor = document.getElementById('listaEventos');
      var filtroTexto = document.getElementById('inputBuscarEvento').value.trim().toLowerCase();
      contenedor.innerHTML = '';
      var filtrados = eventos.filter(function(nombre) { return nombre.toLowerCase().includes(filtroTexto); });
      if (filtrados.length === 0 && filtroTexto !== '') {
        var vacio = document.createElement('div');
        vacio.className = 'entregas__subtitulo';
        vacio.style.marginBottom = '0';
        vacio.textContent = 'No se encontraron eventos.';
        contenedor.appendChild(vacio);
        return;
      }
      filtrados.forEach(function(nombre) {
        var item = document.createElement('div');
        item.className = 'entregas__item-evento';
        item.textContent = nombre;
        item.addEventListener('click', function() {
          eventoSeleccionado = nombre;
          document.getElementById('eventoSeleccionadoTitulo').textContent = nombre;
          document.getElementById('inputCodigo').value = '';
          document.getElementById('errorCodigo').classList.add('oculto');
          mostrarPasoEntregas('pasoCodigo');
        });
        contenedor.appendChild(item);
      });
    }

    document.getElementById('inputBuscarEvento').addEventListener('input', function() {
      renderizarListaEventos(listaEventosCache);
    });

    document.getElementById('btnVolverEventos').addEventListener('click', function() {
      mostrarPasoEntregas('pasoBuscarEvento');
    });

    document.getElementById('btnVerEntrega').addEventListener('click', function() {
      var codigo = document.getElementById('inputCodigo').value.trim();
      var errorEl = document.getElementById('errorCodigo');
      if (codigo === '') {
        errorEl.textContent = 'Ingresá un código.';
        errorEl.classList.remove('oculto');
        return;
      }
      errorEl.classList.add('oculto');
      document.getElementById('pasoCodigo').classList.add('oculto');
      document.getElementById('cargandoEntrega').classList.remove('oculto');

      // ← reemplaza google.script.run.obtenerEntregaPorCodigo()
      apiGet({ action: 'entrega', evento: eventoSeleccionado, codigo: codigo })
        .then(function(respuesta) {
          document.getElementById('cargandoEntrega').classList.add('oculto');
          if (respuesta.error) {
            document.getElementById('pasoCodigo').classList.remove('oculto');
            errorEl.textContent = respuesta.error;
            errorEl.classList.remove('oculto');
            return;
          }
          document.getElementById('eventoActivoTitulo').textContent = respuesta.evento;
          catalogoEntregaActiva = respuesta.fotos;
          renderizarGaleriaEntrega(respuesta.fotos);
          mostrarPasoEntregas('pasoGaleriaEntrega');
        })
        .catch(function(error) {
          document.getElementById('cargandoEntrega').classList.add('oculto');
          document.getElementById('pasoCodigo').classList.remove('oculto');
          errorEl.textContent = 'Error al cargar la entrega. Intentá de nuevo.';
          errorEl.classList.remove('oculto');
          console.error('Error:', error);
        });
    });

    document.getElementById('btnVolverDesdeGaleria').addEventListener('click', function() {
      mostrarPasoEntregas('pasoCodigo');
    });

    document.getElementById('btnDescargarTodo').addEventListener('click', function() {
      if (!catalogoEntregaActiva.length) return;
      var btn = this;
      var label = btn.querySelector('span');
      label.textContent = 'Descargando…';
      btn.disabled = true;
      var delay = 0;
      catalogoEntregaActiva.forEach(function(foto, i) {
        setTimeout(function() {
          var a = document.createElement('a');
          a.href = foto.url_descarga || foto.url;
          a.download = foto.titulo || ('foto_' + (i + 1));
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          if (i === catalogoEntregaActiva.length - 1) {
            setTimeout(function() {
              label.textContent = 'Descargar todo';
              btn.disabled = false;
            }, 800);
          }
        }, delay);
        delay += 400;
      });
    });

    function renderizarGaleriaEntrega(fotos) {
      renderizarGaleriaLadrillo(document.getElementById('galeriaEntrega'), fotos, function(foto, item) {
        entregaActiva = true;
        indiceActualLightbox = catalogoEntregaActiva.findIndex(function(f) { return f.id_drive === foto.id_drive; });
        abrirLightbox(foto, item);
      });
    }

    /* ============================================================
       FLASH DE CÁMARA
       ============================================================ */
    document.addEventListener('click', function(evento) {
      var destello = document.createElement('div');
      destello.className = 'destello-flash';
      destello.style.left = (evento.clientX + -4) + 'px';
      destello.style.top = (evento.clientY + -4) + 'px';
      document.body.appendChild(destello);
      setTimeout(function() { destello.remove(); }, 450);
    });

    /* ============================================================
       RE-RENDER AL CAMBIAR TAMAÑO
       ============================================================ */
    var _resizeTimeout = null;
    window.addEventListener('resize', function() {
      clearTimeout(_resizeTimeout);
      _resizeTimeout = setTimeout(function() {
        if (vistaActiva === 'todo' || vistaActiva === 'retratos') {
          aplicarFiltroGaleria(vistaActiva === 'retratos' ? 'retratos' : 'todo');
        } else if (vistaActiva === 'albumes' && albumActivoTitulo && albumesData[albumActivoTitulo]) {
          renderizarGaleriaLadrillo(document.getElementById('galeriaAlbum'), albumesData[albumActivoTitulo], function(foto, item) {
            entregaActiva = false;
            catalogoFiltrado = albumesData[albumActivoTitulo].slice();
            indiceActualLightbox = catalogoFiltrado.findIndex(function(f) { return f.id_drive === foto.id_drive; });
            abrirLightbox(foto, item);
          });
        } else if (vistaActiva === 'entregas' && catalogoEntregaActiva.length) {
          renderizarGaleriaEntrega(catalogoEntregaActiva);
        }
      }, 250);
    });

    /* ============================================================
       BLOQUEO ZOOM NATIVO
       ============================================================ */
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
    document.addEventListener('touchmove', function(e) {
      if (e.touches.length > 1 && !e.target.closest('#lightboxImagenWrapper')) {
        e.preventDefault();
      }
    }, { passive: false });

    /* ============================================================
       INICIO
       ============================================================ */
    document.getElementById('btnRefrescar').addEventListener('click', function() {
  var btn = this;
  var svg = btn.querySelector('svg');
  svg.style.animation = 'spin 1s linear infinite';
  svg.style.transformOrigin = 'center';

  apiGet({ action: 'limpiarCache' })
    .then(function() {
      return new Promise(function(resolve) { setTimeout(resolve, 1500); });
    })
    .then(function() {
      return apiGet({ action: 'catalogo' });
    })
    .then(function(datos) {
      catalogo = datos;
      construirAlbumes();
      return apiGet({ action: 'likes' });
    })
    .then(function(likes) {
      likesMemoria = likes || {};
      aplicarFiltroGaleria(vistaActiva === 'retratos' ? 'retratos' : 'todo');
      svg.style.animation = '';
    })
    .catch(function(err) {
      console.error('Error al refrescar:', err);
      svg.style.animation = '';
    });
});
    document.addEventListener('DOMContentLoaded', iniciar);
  </script>
